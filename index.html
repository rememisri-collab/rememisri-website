<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemeMisri - Light Luxury Jewelry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', serif;
        }
        body {
            background-color: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }
        /* 顶部导航 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0,0,0,0.85);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 999;
        }
        .brand-logo {
            height: 50px;
            width: auto;
        }
        /* 全屏主视觉 */
        .hero {
            width: 100%;
            height: 100vh;
            padding-top: 80px;
        }
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 品牌区域 */
        .about {
            padding: 80px 5%;
            text-align: center;
            background: #0a0a0a;
        }
        .about-img img {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        /* 产品区域 */
        .products {
            padding: 60px 5%;
            text-align: center;
            background: #111;
        }
        .product-card img {
            max-width: 100%;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- 顶部Logo -->
    <div class="navbar">
        <img src="https://github.com/rememisri-collab/rememisri-website/raw/main/1.jpeg" 
             loading="lazy" alt="RemeMisri Logo" class="brand-logo">
    </div>

    <!-- 全屏主海报 -->
    <section class="hero">
        <img src="https://github.com/rememisri-collab/rememisri-website/raw/main/2.jpeg" 
             loading="lazy" alt="Main Poster">
    </section>

    <!-- 品牌故事 -->
    <section class="about">
        <div class="about-img">
            <img src="https://github.com/rememisri-collab/rememisri-website/raw/main/3.jpeg" 
                 loading="lazy" alt="Brand Story">
        </div>
    </section>

    <!-- 产品展示 -->
    <section class="products">
        <div class="product-card">
            <img src="https://github.com/rememisri-collab/rememisri-website/raw/main/4.jpeg" 
                 loading="lazy" alt="Amazon Listing">
        </div>
    </section>
</body>
</html>
