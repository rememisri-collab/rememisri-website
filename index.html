<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemeMisri - Light Luxury Jewelry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', serif;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0,0,0,0.85);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 999;
        }

        .brand-logo {
            height: 50px;
            width: auto;
        }

        /* Hero Section (Full Screen Main Poster) */
        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Brand Story Section */
        .about {
            padding: 80px 5%;
            text-align: center;
            background: #0a0a0a;
        }

        .about-img img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        /* Product Amazon Image */
        .products {
            padding: 60px 5%;
            text-align: center;
            background: #111;
        }

        .product-card img {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- TOP LOGO -->
    <div class="navbar">
        <img src="https://github.com/rememisri-collab/rememisri-website/blob/main/1.jpeg?raw=true" alt="RemeMisri Logo" class="brand-logo">
    </div>

    <!-- MAIN POSTER (FULL SCREEN) -->
    <section class="hero">
        <img src="https://github.com/rememisri-collab/rememisri-website/blob/main/2.jpeg?raw=true" alt="Main Poster">
    </section>

    <!-- BRAND STORY -->
    <section class="about">
        <div class="about-img">
            <img src="https://github.com/rememisri-collab/rememisri-website/blob/main/3.jpeg?raw=true" alt="Brand Story">
        </div>
    </section>

    <!-- AMAZON MAIN IMAGE -->
    <section class="products">
        <div class="product-card">
            <img src="https://github.com/rememisri-collab/rememisri-website/blob/main/4.jpeg?raw=true" alt="Amazon Listing">
        </div>
    </section>

</body>
</html>
